api_version = "2026-07"

[[extensions]]
name = "my-function-discount-ext"
handle = "my-function-discount-ext"
uid = "0eb42b0c-f71e-4956-bca2-485b6442ccad"
type = "function"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart_lines_discounts_generate_run"

  [extensions.build]
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/my-function-discount-ext.wasm"
  watch = [ "src/**/*.rs" ]

  [extensions.ui.paths]
  create = "/functiondiscount"
  details = "/functiondiscount"

  # Supplies $namespace and $key from the discount configuration metafield.
  [extensions.input.variables]
  namespace = "barebone_app_function_discount"
  key = "customer_meta"
